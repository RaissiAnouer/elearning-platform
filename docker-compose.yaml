version: "3"

services:
  frontend:
    image: node:22
    container_name: frontend
    working_dir: /app
    command: npm run dev
    ports:
      - "5000:5000"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/server
    env_file:
    - .env
